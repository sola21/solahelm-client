name: solahelm_client
description: "SolaHelm client: sing-box and mihomo in one app"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hotkey_manager: 0.2.3
  intl: any
  launch_at_startup: ^0.5.1
  tray_manager: 0.5.2
  window_manager: 0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
